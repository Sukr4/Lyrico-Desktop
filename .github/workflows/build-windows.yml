name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: [.github/workflows/diagnose.yml]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Set up MSYS2 build tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            make
            diffutils
            pkgconf
            nasm
            yasm

      - name: Configure MSYS2 path
        shell: pwsh
        run: |
          $root = '${{ steps.msys2.outputs.msys2-location }}'
          if (!(Test-Path "$root/usr/bin/bash.exe") -or !(Test-Path "$root/usr/bin/cmp.exe")) { throw "Incomplete MSYS2: $root" }
          "LYRICO_MSYS2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm run tauri build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lyrico-build-diagnostics
          path: |
            build.log
            src-tauri/target/release/build/**/*.log
            src-tauri/target/native/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lyrico-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Preserve failed build log
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('build.log')) return;
            try { await github.rest.git.createRef({...context.repo,ref:'refs/heads/ci-diagnostics',sha:context.sha}); } catch(e) { if(e.status!==422) throw e; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo,branch:'ci-diagnostics',path:'build-'+context.runId+'.log',message:'Preserve build failure log',content:fs.readFileSync('build.log').toString('base64')});
